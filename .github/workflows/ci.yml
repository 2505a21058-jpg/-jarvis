name: Jarvis CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --cov=agent --cov=memory --cov=skills --cov-report=term-missing
      - name: Gate hit rate check
        run: |
          python -c "
          from agent.gate import GateLayer, GATE_RULES
          g = GateLayer(list(GATE_RULES))
          inputs = ['open chrome','hello','thanks','search for python',
                    'type hello world','what can you do','launch firefox',
                    'go to https://example.com','hey jarvis',
                    'what is machine learning?','complex multi step task here now']
          hits = sum(1 for i in inputs if g.evaluate(i).resolved)
          rate = hits / len(inputs)
          print(f'Gate hit rate: {rate:.0%}')
          assert rate >= 0.60, f'Gate hit rate {rate:.0%} below 60% target'
          "
